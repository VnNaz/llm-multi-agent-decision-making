# Быстрый smoke test: одна стратегия, два раунда, без доступа к LLM.
experiment:
  game: rps
  scenarios: [constant_rock]
  num_rounds: 2
  num_tests: 1
  seed: 2024
llm:
  provider: random
  model: qwen2.5:7b
  temperature: 0.7
  max_tokens: 100
  timeout: 120
  retries: 1
output:
  directory: results/rps/smoke
